[package]
name = "sealbin-format"
description = "The sealbin handoff format: link, envelope, chunked AEAD, KDFs, read token, bundle"
# publish = false until #25 flips it for the crates release.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Pure: no I/O, no clocks, no randomness except through a caller-supplied RNG.
# The crypto crates are declared workspace-wide (D2, D5); `subtle` and
# `rand_core` come from the same RustCrypto stack so the tree holds one copy.
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
zeroize.workspace = true
subtle.workspace = true
rand_core.workspace = true
# The agent key bundle: Ed25519 signs, X25519 agrees. Both are on the same
# digest stack as the crates above (see the workspace manifest).
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Vector generation and tests only; not part of the published crate.
proptest.workspace = true
rand_chacha.workspace = true
pbkdf2.workspace = true
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "gen-vectors"
path = "examples/gen-vectors/main.rs"
