[package]
name = "sealbin-server"
description = "Sealbin harness modules: seals, agents, accounts, billing, audit, teams"
# publish = false until #25 flips it for the crates release.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The harness kernel: `Module`, `Harness`, ports and errors (D1, D10).
cratefield-core = { workspace = true }
# The `/.well-known/sealbin` document is JSON.
serde_json = { workspace = true }

[dev-dependencies]
# The conformance kit: fake ports and the no-network request helpers.
cratefield-testing = { workspace = true }
# An executor for the kit's async request helpers (`#[pollster::test]`).
pollster = { workspace = true }
