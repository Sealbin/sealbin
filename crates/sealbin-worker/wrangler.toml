# Cloudflare Workers configuration for the sealbin Worker. Shape copied from
# Cratefield/harness ventures/cratefield-waitlist/wrangler.toml.
name = "sealbin"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

