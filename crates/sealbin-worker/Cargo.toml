[package]
name = "sealbin-worker"
description = "The sealbin Cloudflare Worker: harness composition and the SealObject Durable Object"
# publish = false until #25 flips it for the crates release.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
worker = { workspace = true }
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }

# getrandom's opt-in wasm backend (see the workspace manifest). Only on wasm, so
# a native `cargo test` / `cargo clippy` never pulls it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
