# Deploys the sealbin Worker to the `staging` environment on every push to
# main, and on demand. Needs the CLOUDFLARE_API_TOKEN repository secret (and
# CLOUDFLARE_ACCOUNT_ID when the token can see more than one account); without
# it the job skips itself instead of failing every push.
#
# The staging D1 database and R2 bucket must exist first — every manual step is
# in crates/sealbin-worker/README.md.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: a second in-flight `wrangler deploy` for the same
# script would race the first. Not cancelled, so a queued run still lands.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy staging
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # A missing secret cannot be read from a job-level `if:`, so the guard
      # runs first and later steps key off its output.
      - name: Check for the Cloudflare credentials
        id: guard
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the staging deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.enabled == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: steps.guard.outputs.enabled == 'true'
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.enabled == 'true'
      - name: Install worker-build (pinned to the worker 0.8.7 line)
        if: steps.guard.outputs.enabled == 'true'
        run: cargo install --locked worker-build --version 0.8.7
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: "24"
      - name: Install wrangler
        if: steps.guard.outputs.enabled == 'true'
        run: npm i -g wrangler@4

      - name: Build the web assets
        if: steps.guard.outputs.enabled == 'true'
        run: bash web/build.sh

      - name: Apply the staging D1 migrations
        if: steps.guard.outputs.enabled == 'true'
        working-directory: crates/sealbin-worker
        run: wrangler d1 migrations apply DB --env staging --remote

      - name: Deploy to staging
        if: steps.guard.outputs.enabled == 'true'
        working-directory: crates/sealbin-worker
        run: wrangler deploy --env staging
