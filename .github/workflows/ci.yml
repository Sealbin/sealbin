# CI for the sealbin workspace (issue #1).
#
# The toolchain comes from rust-toolchain.toml (channel 1.98.1, rustfmt +
# clippy, wasm32-unknown-unknown); the dtolnay step below is kept in sync with
# it by hand. Every job runs on ubuntu-latest and a fresh runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same branch are cancelled; a push to main always runs
# to completion so the branch reflects a green build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: One copy of every harness crate
        run: |
          set -euo pipefail
          # Two copies of cratefield-core in one graph do not type-check against
          # each other (design decision D2). `--depth 0` lists only the
          # duplicated crates themselves, so a match here is a real duplicate.
          dupes=$(cargo tree -d --depth 0 --target all | grep -E '^(cratefield-|worker )' || true)
          if [ -n "$dupes" ]; then
            echo "::error::more than one version of a harness crate in the graph:"
            echo "$dupes"
            exit 1
          fi
          echo "one copy of every cratefield-* crate and of worker"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo check
          -p sealbin-format -p sealbin-core -p sealbin-server -p sealbin-worker -p sealbin-wasm
          --target wasm32-unknown-unknown

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  worker-size:
    name: worker size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install worker-build (pinned to the worker 0.8.5 line)
        run: cargo install --locked worker-build --version 0.8.5
      - name: Build the Worker bundle
        working-directory: crates/sealbin-worker
        run: worker-build --release
      - name: Assert the bundle and measure its gzipped size
        working-directory: crates/sealbin-worker
        run: |
          set -euo pipefail
          shim="build/worker/shim.mjs"
          if [ ! -f "$shim" ]; then
            echo "::error::$shim was not produced by worker-build"
            exit 1
          fi

          # The entrypoint shim, the JS that carries the wasm-bindgen glue, and
          # the wasm module(s): everything Cloudflare ships, gzipped the way it
          # compresses the upload. 3 MiB (3145728 bytes) is the Workers Free
          # limit for the gzipped bundle.
          limit=3145728
          total=0
          while IFS= read -r f; do
            n=$(gzip -9 -c "$f" | wc -c)
            printf '%8d bytes gzipped  %s\n' "$n" "$f"
            total=$((total + n))
          done < <(find build -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.wasm' \) | sort)

          pct=$(awk "BEGIN { printf \"%.1f\", 100 * $total / $limit }")
          {
            echo "### Worker bundle size"
            echo
            echo "| metric | bytes |"
            echo "| :-- | --: |"
            echo "| gzipped total | $total |"
            echo "| Workers Free limit | $limit |"
            echo "| used | ${pct}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "gzipped Worker bundle: $total bytes (${pct}% of $limit)"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::Worker bundle is $total bytes gzipped, over the $limit-byte Workers Free limit"
            exit 1
          fi
